<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreateAI</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0b10;color:#fff}main{max-width:720px;margin:auto;padding:24px}.card{background:#171720;border:1px solid #292936;border-radius:20px;padding:20px;margin:14px 0}textarea{width:100%;box-sizing:border-box;min-height:130px;background:#0f0f15;color:#fff;border:1px solid #333;border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:12px;padding:13px 18px;margin:8px 6px 0 0;font-weight:700}button.primary{background:#fff;color:#000}.muted{color:#aaa}.pill{background:#292936;color:#fff}</style></head>
<body><main><h1>✨ CreateAI</h1><p class="muted">AI image & video creation</p><div class="card"><h2>What do you want to create?</h2><textarea id="prompt" placeholder="Describe your image or video..."></textarea><button class="primary" onclick="generate('image')">🖼️ Create Image</button><button class="pill" onclick="generate('video')">🎬 Create Video</button><p id="status" class="muted">Choose a generation type to begin.</p></div>
<div class="card"><h2>Styles</h2><button class="pill" onclick="style('Cinematic')">Cinematic</button><button class="pill" onclick="style('Anime')">Anime</button><button class="pill" onclick="style('Photorealistic')">Photorealistic</button><button class="pill" onclick="style('Illustration')">Illustration</button></div>
<div class="card"><h2>📚 My Creations</h2><p class="muted">Generated media will appear here after an AI backend is connected.</p></div></main>
<script>let selected='';function style(s){selected=s;status.textContent='Style selected: '+s}function generate(type){let p=prompt.value.trim();status.textContent=p?'Ready to generate '+type+' with '+(selected||'default')+' style.':'Enter a prompt first.'}</script></body></html>
