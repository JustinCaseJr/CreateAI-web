<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><div><h1>Create AI</h1><p>Turn a description into an image.</p></div><span id="status">Ready</span></header><div class="tabs"><button class="active" id="imageTab">Create image</button><button id="videoTab">Create video</button></div><section id="imagePanel"><label for="prompt">Describe your image</label><textarea id="prompt" rows="5" placeholder="Example: a cinematic anime city at sunset..."></textarea><div class="row"><label>Style<select id="style"><option value="">None</option><option>Anime illustration</option><option>Cinematic</option><option>Digital painting</option><option>Fantasy concept art</option></select></label><label>Size<select id="size"><option value="768">768 × 768</option><option value="1024" selected>1024 × 1024</option></select></label></div><button id="generate" class="primary">Generate image</button><p id="message"></p><div id="result" hidden><img id="generated" alt="Generated image"><a id="download" download="create-ai-image.jpg">Save image</a></div></section><section id="videoPanel" hidden><h2>Video creation</h2><p>Video generation needs a video model/provider connection. The image workflow is ready first.</p></section></main><script src="app.js"></script></body></html>
