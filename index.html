<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header class="topbar"><div><h1>Create AI</h1><p>Create, chat, and build characters.</p></div><span id="status">Ready</span></header><nav class="tabs"><button class="tab active" data-tab="chat">AI Chat</button><button class="tab" data-tab="character">Characters</button><button class="tab" data-tab="image">Create Image</button><button class="tab" data-tab="video">Create Video</button><button class="tab" data-tab="library">My Creations</button></nav><section id="chatPanel" class="panel"><div id="activeCharacter" class="active-character">No character selected</div><div id="chatLog" class="chat-log"></div><form id="chatForm"><textarea id="chatInput" rows="3" placeholder="Say something..."></textarea><div class="action-row"><button class="secondary" type="button" id="newChat">New chat</button><button class="secondary" type="button" id="memoryButton">Memory</button><button class="secondary" type="button" id="agentHelp">Agent</button><button class="primary" type="submit">Send</button></div></form></section><section id="characterPanel" class="panel" hidden><div id="characterList" class="character-list"></div><form id="characterForm" class="character-form"><input id="characterName" required placeholder="Character name"><input id="characterPersonality" required placeholder="Personality, e.g. witty and curious"><textarea id="characterDescription" rows="4" placeholder="Background or other details"></textarea><div class="action-row"><button class="primary" type="submit">Save character</button><button class="secondary" type="button" id="cancelCharacter">Clear</button></div></form></section><section id="imagePanel" class="panel" hidden><label>Prompt<textarea id="prompt" rows="5" placeholder="Describe what you want to create..."></textarea></label><div class="prompt-tools"><button class="secondary" type="button" id="enhancePrompt">Enhance prompt</button><button class="secondary" type="button" id="clearPrompt">Clear</button></div><div class="row"><label>Style<select id="style"><option value="">Default</option><option>cinematic</option><option>anime</option><option>illustration</option><option>photorealistic</option><option>fantasy art</option><option>concept art</option><option>3D render</option></select></label><label>Size<select id="size"><option value="1024">1024</option><option value="768">768</option><option value="512">512</option></select></label></div><div class="row"><label>Aspect ratio<select id="ratio"><option value="1:1">Square 1:1</option><option value="16:9">Landscape 16:9</option><option value="9:16">Portrait 9:16</option><option value="4:3">Classic 4:3</option><option value="3:4">Portrait 3:4</option></select></label><label>Quality<select id="quality"><option value="balanced">Balanced</option><option value="draft">Draft</option><option value="detailed">Detailed</option></select></label></div><label>Negative prompt<textarea id="negativePrompt" rows="3" placeholder="Things to avoid (optional)..."></textarea></label><button class="primary" id="generate" type="button">Generate image</button><p id="message"></p><div id="result" hidden><img id="generated"><a id="download" download="create-ai-image.jpg">Download image</a></div></section><section id="videoPanel" class="panel" hidden><h2>Video creation</h2><p class="library-empty">Video generation is the next provider integration. The interface is ready for it.</p></section><section id="libraryPanel" class="panel" hidden><h2>My Creations</h2><div id="libraryList" class="creation-list"></div></section></main><script src="app.js"></script></body></html>
